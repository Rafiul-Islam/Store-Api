spring:
  application:
    name: store-api
  datasource:
    url: jdbc:mysql://localhost:3306/store_api?createDatabaseIfNotExist=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpirationInSeconds: ${JWT_ACCESS_TOKEN_EXPIRATION_IN_SEC}
    refreshTokenExpirationInSeconds: ${JWT_REFRESH_TOKEN_EXPIRATION_IN_SEC}


springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8081

stripe:
    secretKey: ${STRIPE_SECRET_KEY}

website:
  url: ${WEBSITE_URL}