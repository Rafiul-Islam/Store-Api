spring:
  application:
    name: store-api
  datasource:
    url: jdbc:mysql://localhost:3306/store_api?createDatabaseIfNotExist=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  jwt:
    secret: ${JWT_SECRET}
    token-expiration-in-seconds: ${JWT_SECRET_EXPIRATION_IN_SEC}


springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8081